name: "Release"
on:
  release:
    types: [published]

jobs:
  containerize:
    name: ⚙️ Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub's Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/szpontniki/web:${{ github.event.release.tag_name }} .
          docker build -t ghcr.io/szpontniki/web:latest .

      - name: Push Docker images
        run: |
          docker push ghcr.io/szpontniki/web:${{ github.event.release.tag_name }}
          docker push ghcr.io/szpontniki/web:latest
