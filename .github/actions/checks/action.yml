name: Checks
description: Performs tests on the build

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v3

    - name: Set up the project
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: nix develop -c bash -c 'npm install && npm run init'

    - name: Build
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: nix develop -c npm run build
